name: test-build

on:
  push:
  pull_request:

jobs:
  scene:
    name: scene build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install dependencies
        run: npm install
      - name: npm run build
        run: npm run build

  server:
    name: server typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite ships with the runtime from 22.5 onwards.
          node-version: 24
      - name: install dependencies
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320"
     role="img"
     aria-label="Mochi — appends every stranger's move to one creature's body, credited by name. A named move descends into the empty slot at the end of the chain, the bead turns credited, and the creature's size steps up one notch and stays there.">
  <title>Mochi — a pastel blob co-parented by every stranger who visits</title>

<!-- STORYBOARD (dur 8s — must equal this file's single master dur)
  0-10%   steady state: plate, mark, wordmark, tagline, metric and tech line all opaque;
                        meadow stage with the blob at rest, eight credited beads and one
                        empty slot at the right end of the chain (poster rule)
  10-25%  trigger:      a named tag descends toward the empty slot                data-story="beat-2"
  25-55%  mechanism:    A stranger's move lands: the blob swells one notch and its last untended bead turns credited.
                                                                                  data-story="beat-3"
  55-80%  resolution:   the size rule stays stepped up, the bead keeps its name, and a beam
                        sweeps the plate once                                     data-story="beat-4"
  80-100% breathe + seam fade — the story layer is fully out by 98%, and the swell only
          settles in the last 6%, so the residue holds 25-90% of the loop
-->

  <defs>
    <linearGradient id="h-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFF4E6"/>
      <stop offset="60%"  stop-color="#FFF1E0"/>
      <stop offset="100%" stop-color="#FFE8F1"/>
    </linearGradient>
    <linearGradient id="h-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"    stop-color="#FFF7EC"/>
      <stop offset="61%"   stop-color="#FFF4E6"/>
      <stop offset="61.5%" stop-color="#C9F0DC"/>
      <stop offset="100%"  stop-color="#A8E6CF"/>
    </linearGradient>
    <linearGradient id="h-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD9E8"/>
      <stop offset="100%" stop-color="#FFC2DC"/>
    </linearGradient>
    <linearGradient id="h-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B2436A"/>
      <stop offset="100%" stop-color="#93375A"/>
    </linearGradient>
    <linearGradient id="h-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="h-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 L0 48" fill="none" stroke="#4A3B52" stroke-width="1" opacity="0.05"/>
    </pattern>

    <filter id="h-aurora" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="h-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <clipPath id="h-plate-clip">
      <rect x="0" y="0" width="1280" height="320" rx="30" ry="30"/>
    </clipPath>
    <clipPath id="h-stage-clip">
      <rect x="560" y="26" width="684" height="268" rx="22" ry="22"/>
    </clipPath>
    <clipPath id="h-chi-clip">
      <g transform="translate(255.9, 92)">
        <path d="M26.1 1Q19.1 1 13.9-1.8Q8.6-4.6 5.8-9.7Q3-14.8 3-21.7Q3-26.9 4.6-31.1Q6.2-35.2 9.2-38.1Q12.2-41 16.5-42.5Q20.9-44.1 26.1-44.1Q28.9-44.1 31.9-43.4Q35-42.8 38-41.2Q39.8-40.4 40.4-38.9Q41.1-37.5 40.9-35.9Q40.7-34.4 39.8-33.2Q38.9-32 37.5-31.6Q36.1-31.2 34.3-32.1Q32.6-33.1 30.8-33.5Q29-34 27.5-34Q24.8-34 22.8-33.1Q20.8-32.3 19.4-30.8Q18-29.2 17.3-26.9Q16.5-24.6 16.5-21.6Q16.5-15.8 19.4-12.5Q22.3-9.2 27.5-9.2Q29-9.2 30.8-9.6Q32.6-10 34.3-11Q36.1-11.9 37.5-11.4Q38.9-11 39.7-9.8Q40.6-8.6 40.7-7.1Q40.8-5.5 40.2-4.1Q39.5-2.6 37.8-1.8Q34.8-0.4 31.9 0.3Q28.9 1 26.1 1M53.9 0.8Q50.6 0.8 48.9-1Q47.2-2.7 47.2-6L47.2-56.1Q47.2-59.4 48.9-61.1Q50.6-62.8 53.9-62.8Q57-62.8 58.7-61.1Q60.5-59.4 60.5-56.1L60.5-37.3Q62.3-40 65.3-41.8Q69.3-44.1 74.4-44.1Q79.6-44.1 82.9-42.1Q86.2-40.1 87.9-36.1Q89.6-32.1 89.6-26L89.6-6Q89.6-2.7 87.9-1Q86.2 0.8 82.9 0.8Q79.7 0.8 78-1Q76.3-2.7 76.3-6L76.3-25.3Q76.3-29.8 74.7-31.8Q73-33.8 69.7-33.8Q65.5-33.8 63-31.2Q60.5-28.5 60.5-24.1L60.5-6Q60.5 0.8 53.9 0.8M106.2 0.7Q103 0.7 101.2-1.2Q99.5-3.1 99.5-6.5L99.5-36.6Q99.5-40.1 101.2-42Q103-43.9 106.2-43.9Q109.4-43.9 111.1-42Q112.8-40.1 112.8-36.6L112.8-6.5Q112.8-3.1 111.1-1.2Q109.5 0.7 106.2 0.7M106.2-51.1Q102.5-51.1 100.5-52.8Q98.6-54.6 98.6-57.7Q98.6-61 100.5-62.7Q102.5-64.4 106.2-64.4Q109.9-64.4 111.8-62.7Q113.8-61 113.8-57.7Q113.8-54.6 111.8-52.8Q109.9-51.1 106.2-51.1"/>
      </g>
    </clipPath>
  </defs>

  <style>
    /* Ambient only — carries no story, so it is deliberately desynced from the
       8s master timeline (hard rule 4, CSS exception). Nothing here ever hits
       zero opacity, so frame 0 is always a complete poster. */
    @keyframes drift-a {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(46px, -18px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes drift-b {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(-38px, 22px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes metric-pulse {
      0%   { opacity: 1; }
      50%  { opacity: 0.72; }
      100% { opacity: 1; }
    }
    @keyframes dot-breath {
      0%   { opacity: 1; }
      50%  { opacity: 0.45; }
      100% { opacity: 1; }
    }
    .aurora-a { animation: drift-a 15s ease-in-out infinite alternate; }
    .aurora-b { animation: drift-b 19s ease-in-out infinite alternate; }
    .metric   { animation: metric-pulse 8s ease-in-out infinite; }
    .livedot  { animation: dot-breath 8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- ===== plate: mandatory, opaque, self-sufficient on light AND dark GitHub ===== -->
  <rect x="0" y="0" width="1280" height="320" rx="30" ry="30" fill="url(#h-plate)"/>

  <g clip-path="url(#h-plate-clip)">
    <circle class="aurora-a" cx="250" cy="70"  r="150" fill="#FFC2DC" opacity="0.34" filter="url(#h-aurora)"/>
    <circle class="aurora-b" cx="980" cy="280" r="170" fill="#A8E6CF" opacity="0.30" filter="url(#h-aurora)"/>
    <rect x="0" y="0" width="1280" height="320" fill="url(#h-grid)"/>

    <!-- ============================= LEFT: brand ============================= -->
    <!-- mini mark: the same sphere-and-plane-eyes the scene renders -->
    <ellipse cx="76" cy="62" rx="30" ry="26" fill="url(#h-body)" stroke="#7A5165" stroke-width="4">
      <animate attributeName="ry" dur="8s" repeatCount="indefinite"
               keyTimes="0;0.10;0.18;0.30;0.42;0.90;0.96;1"
               values="26;26;23;30;28;28;26;26"/>
      <animate attributeName="rx" dur="8s" repeatCount="indefinite"
               keyTimes="0;0.10;0.18;0.30;0.42;0.90;0.96;1"
               values="30;30;32;28;31;31;30;30"/>
    </ellipse>
    <rect x="61" y="54" width="7" height="13" rx="3.5" fill="#7A5165"/>
    <rect x="84" y="54" width="7" height="13" rx="3.5" fill="#7A5165"/>

    <!-- outlined wordmark (Nunito 800, opentype.js) — never <text> -->
    <g transform="translate(122, 92)" fill="#3B2A44">
      <path d="M12.6 0.8Q9.6 0.8 8-0.9Q6.4-2.6 6.4-5.5L6.4-56.5Q6.4-59.5 8.1-61.2Q9.9-62.8 12.8-62.8Q15.5-62.8 17-61.8Q18.6-60.8 19.9-58.3L38.7-23.9L57.6-58.3Q58.9-60.8 60.4-61.8Q62-62.8 64.5-62.8Q67.5-62.8 69.1-61.2Q70.8-59.5 70.8-56.5L70.8-5.5Q70.8-2.6 69.2-0.9Q67.6 0.8 64.6 0.8Q61.6 0.8 60-0.9Q58.3-2.6 58.3-5.5L58.3-37.8L43.9-11.9Q42.9-10.2 41.7-9.4Q40.5-8.5 38.5-8.5Q36.6-8.5 35.4-9.4Q34.1-10.3 33.2-11.9L18.7-37.5L18.7-5.5Q18.7-2.6 17.2-0.9Q15.7 0.8 12.6 0.8M103 1Q96 1 90.9-1.8Q85.7-4.5 82.9-9.6Q80.1-14.7 80.1-21.6Q80.1-26.8 81.7-31Q83.2-35.1 86.3-38.1Q89.3-41 93.5-42.5Q97.8-44.1 103-44.1Q109.9-44.1 115.1-41.4Q120.2-38.6 123.1-33.6Q125.9-28.6 125.9-21.6Q125.9-16.4 124.3-12.2Q122.7-8.1 119.7-5.1Q116.7-2.1 112.4-0.6Q108.2 1 103 1M103-9Q105.9-9 108-10.4Q110.1-11.8 111.3-14.6Q112.6-17.3 112.6-21.6Q112.6-28.1 109.9-31.1Q107.3-34.1 103-34.1Q100.1-34.1 98-32.8Q95.8-31.5 94.6-28.7Q93.5-26 93.5-21.6Q93.5-15.2 96.1-12.1Q98.7-9 103-9"/>
    </g>
    <g transform="translate(255.9, 92)" fill="url(#h-word)">
      <path d="M26.1 1Q19.1 1 13.9-1.8Q8.6-4.6 5.8-9.7Q3-14.8 3-21.7Q3-26.9 4.6-31.1Q6.2-35.2 9.2-38.1Q12.2-41 16.5-42.5Q20.9-44.1 26.1-44.1Q28.9-44.1 31.9-43.4Q35-42.8 38-41.2Q39.8-40.4 40.4-38.9Q41.1-37.5 40.9-35.9Q40.7-34.4 39.8-33.2Q38.9-32 37.5-31.6Q36.1-31.2 34.3-32.1Q32.6-33.1 30.8-33.5Q29-34 27.5-34Q24.8-34 22.8-33.1Q20.8-32.3 19.4-30.8Q18-29.2 17.3-26.9Q16.5-24.6 16.5-21.6Q16.5-15.8 19.4-12.5Q22.3-9.2 27.5-9.2Q29-9.2 30.8-9.6Q32.6-10 34.3-11Q36.1-11.9 37.5-11.4Q38.9-11 39.7-9.8Q40.6-8.6 40.7-7.1Q40.8-5.5 40.2-4.1Q39.5-2.6 37.8-1.8Q34.8-0.4 31.9 0.3Q28.9 1 26.1 1M53.9 0.8Q50.6 0.8 48.9-1Q47.2-2.7 47.2-6L47.2-56.1Q47.2-59.4 48.9-61.1Q50.6-62.8 53.9-62.8Q57-62.8 58.7-61.1Q60.5-59.4 60.5-56.1L60.5-37.3Q62.3-40 65.3-41.8Q69.3-44.1 74.4-44.1Q79.6-44.1 82.9-42.1Q86.2-40.1 87.9-36.1Q89.6-32.1 89.6-26L89.6-6Q89.6-2.7 87.9-1Q86.2 0.8 82.9 0.8Q79.7 0.8 78-1Q76.3-2.7 76.3-6L76.3-25.3Q76.3-29.8 74.7-31.8Q73-33.8 69.7-33.8Q65.5-33.8 63-31.2Q60.5-28.5 60.5-24.1L60.5-6Q60.5 0.8 53.9 0.8M106.2 0.7Q103 0.7 101.2-1.2Q99.5-3.1 99.5-6.5L99.5-36.6Q99.5-40.1 101.2-42Q103-43.9 106.2-43.9Q109.4-43.9 111.1-42Q112.8-40.1 112.8-36.6L112.8-6.5Q112.8-3.1 111.1-1.2Q109.5 0.7 106.2 0.7M106.2-51.1Q102.5-51.1 100.5-52.8Q98.6-54.6 98.6-57.7Q98.6-61 100.5-62.7Q102.5-64.4 106.2-64.4Q109.9-64.4 111.8-62.7Q113.8-61 113.8-57.7Q113.8-54.6 111.8-52.8Q109.9-51.1 106.2-51.1"/>
    </g>
    <!-- shimmer: fires under the gradient word exactly when the move is appended -->
    <g clip-path="url(#h-chi-clip)">
      <rect data-story="beat-3" x="80" y="20" width="34" height="90" fill="#FFFFFF"
            transform="skewX(-20)" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.28;0.33;0.52;0.57;1" values="0;0;0.6;0.6;0;0"/>
        <animate attributeName="x" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.28;0.57;1" values="240;240;420;420"/>
      </rect>
    </g>

    <text x="46" y="128" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="600" fill="#5E4666">A pastel blob co-parented by</text>
    <text x="46" y="151" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="600" fill="#5E4666">every stranger who visits.</text>

    <circle class="livedot" cx="52" cy="188" r="6" fill="#FF8FB1" stroke="#B2436A" stroke-width="2"/>
    <text class="metric" x="68" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="23" font-weight="600" fill="#B2436A">every move credited</text>

    <rect x="46" y="210" width="232" height="9" rx="4.5" fill="#FFD9E8" stroke="#7A5165"
          stroke-width="1" opacity="0.85"/>
    <rect x="46" y="210" width="186" height="9" rx="4.5" fill="#FF8FB1"/>
    <text x="46" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12" fill="#5E4666">size = the sum of every feeding, by every visitor</text>

    <text x="46" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12.5" fill="#5E4666">SDK7 &#183; TypeScript &#183; react-ecs &#183; Tween &#183; WebSocket &#183; SQLite</text>
    <text x="46" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11" fill="#6B5470">MIT &#183; Decentraland Friendzone Mobile Buildathon</text>

    <!-- ========================== RIGHT: the mechanism ======================= -->
    <rect x="560" y="26" width="684" height="268" rx="22" ry="22" fill="url(#h-stage)"
          stroke="#7A5165" stroke-opacity="0.16" stroke-width="2"/>

    <g clip-path="url(#h-stage-clip)">
      <!-- size rule: the notch that steps up and stays up -->
      <g stroke="#7A5165" stroke-width="1.5" opacity="0.32">
        <line x1="600" y1="112" x2="640" y2="112"/>
        <line x1="600" y1="142" x2="640" y2="142"/>
        <line x1="600" y1="172" x2="640" y2="172"/>
        <line x1="600" y1="202" x2="640" y2="202"/>
      </g>
      <text x="600" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#5E4666">size</text>
      <rect x="598" y="170" width="44" height="6" rx="3" fill="#FF8FB1" stroke="#B2436A" stroke-width="1.5">
        <animate attributeName="y" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.25;0.34;0.42;0.90;0.96;1"
                 values="170;170;170;144;140;140;170;170"/>
      </rect>

      <!-- glow breath -->
      <ellipse cx="760" cy="152" rx="80" ry="66" fill="#FF8FB1" opacity="0.18" filter="url(#h-glow)"/>
      <ellipse cx="760" cy="212" rx="62" ry="9" fill="#7A5165" opacity="0.12"/>

      <!-- the blob: a sub-2k-triangle sphere under tween squash-stretch -->
      <ellipse cx="760" cy="156" rx="68" ry="58" fill="url(#h-body)" stroke="#7A5165" stroke-width="8">
        <animate attributeName="ry" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.18;0.30;0.42;0.90;0.96;1"
                 values="58;58;53;66;63;63;58;58"/>
        <animate attributeName="rx" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.18;0.30;0.42;0.90;0.96;1"
                 values="68;68;73;64;70;70;68;68"/>
        <animate attributeName="cy" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.18;0.30;0.42;0.90;0.96;1"
                 values="156;156;161;148;151;151;156;156"/>
      </ellipse>

      <g>
        <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
                          keyTimes="0;0.10;0.18;0.30;0.42;0.90;0.96;1"
                          values="0 0;0 0;0 5;0 -8;0 -5;0 -5;0 0;0 0"/>
        <rect x="728" y="134" width="14" height="25" rx="7" fill="#7A5165">
          <animate attributeName="height" dur="8s" repeatCount="indefinite"
                   keyTimes="0;0.60;0.63;0.66;1" values="25;25;3;25;25"/>
          <animate attributeName="y" dur="8s" repeatCount="indefinite"
                   keyTimes="0;0.60;0.63;0.66;1" values="134;134;144;134;134"/>
        </rect>
        <rect x="778" y="134" width="14" height="25" rx="7" fill="#7A5165">
          <animate attributeName="height" dur="8s" repeatCount="indefinite"
                   keyTimes="0;0.60;0.63;0.66;1" values="25;25;3;25;25"/>
          <animate attributeName="y" dur="8s" repeatCount="indefinite"
                   keyTimes="0;0.60;0.63;0.66;1" values="134;134;144;134;134"/>
        </rect>
      </g>

      <!-- the chain: ordered, left to right. Never an orbit — "last" is the point. -->
      <line x1="676" y1="262" x2="1120" y2="262" stroke="#7A5165" stroke-width="3" opacity="0.2"/>
      <g fill="#FFC2DC" stroke="#7A5165" stroke-width="5">
        <circle cx="690"  cy="262" r="11"/>
        <circle cx="742"  cy="262" r="11"/>
        <circle cx="794"  cy="262" r="11"/>
        <circle cx="846"  cy="262" r="11"/>
        <circle cx="898"  cy="262" r="11"/>
        <circle cx="950"  cy="262" r="11"/>
        <circle cx="1002" cy="262" r="11"/>
        <circle cx="1054" cy="262" r="11"/>
      </g>

      <!-- the empty slot, vacated when the move lands -->
      <circle cx="1106" cy="262" r="11" fill="none" stroke="#7A5165" stroke-width="4"
              stroke-dasharray="5 6" opacity="0.55">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.18;0.26;0.98;1" values="0.55;0.55;0;0;0.55"/>
      </circle>

      <!-- the arriving move -->
      <circle data-story="beat-2" cx="1106" cy="262" r="11" fill="#FF8FB1" stroke="#B2436A"
              stroke-width="5" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.22;0.94;0.98;1" values="0;0;1;1;0;0"/>
        <animate attributeName="cy" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.22;0.94;0.98;1" values="212;212;262;262;262;262"/>
        <animate attributeName="r" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.22;0.34;0.94;1" values="8;8;11;16;16;16"/>
      </circle>

      <!-- the credited ring seals shut and stays sealed -->
      <circle data-story="beat-3" cx="1106" cy="262" r="25" fill="none" stroke="#B2436A"
              stroke-width="4" opacity="0.6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.26;0.46;0.94;0.98;1" values="100;100;0;0;0;100"/>
      </circle>

      <!-- one ripple at the instant of the append -->
      <circle data-story="beat-4" cx="1106" cy="262" r="16" fill="none" stroke="#FF8FB1"
              stroke-width="4" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.30;0.36;0.54;1" values="0;0;0.75;0;0"/>
        <animate attributeName="r" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.30;0.36;0.54;1" values="16;16;34;58;58"/>
      </circle>

      <!-- the name that rides down with the move, and stays -->
      <g data-story="beat-2" opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
                 keyTimes="0;0.10;0.22;0.94;0.98;1" values="0;0;1;1;0;0"/>
        <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
                          keyTimes="0;0.10;0.24;0.94;0.98;1"
                          values="0 -150;0 -150;0 0;0 0;0 0;0 0"/>
        <rect x="1010" y="190" width="192" height="34" rx="10" fill="#FFFFFF"
              stroke="#B2436A" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="1024" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="13" fill="#3B2A44">move #26 &#183; <tspan fill="#B2436A">@kito</tspan></text>
      </g>

      <!-- kept short: the stage's 22px corner radius clips anything past x&#8776;1234 at this y -->
      <text x="676" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11.5" fill="#4A3B52">chain_move &#183; APPEND ONLY &#183; every move keeps its teacher's name</text>
    </g>

    <!-- one beam sweep per loop -->
    <rect data-story="beat-4" x="-300" y="-80" width="150" height="480" fill="url(#h-beam)"
          transform="skewX(-18)" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
               keyTimes="0;0.55;0.60;0.76;0.80;1" values="0;0;0.72;0.72;0;0"/>
      <animate attributeName="x" dur="8s" repeatCount="indefinite"
               keyTimes="0;0.55;0.80;1" values="-300;-300;1520;1520"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1278" height="318" rx="29" ry="29" fill="none"
        stroke="#7A5165" stroke-width="2" opacity="0.2"/>
</svg>

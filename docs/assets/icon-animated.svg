<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img"
     aria-label="Mochi — appends every stranger's move to one creature's body, credited by name. A bead arrives at the end of the chain, takes a name, and the blob swells one notch and stays that size.">
  <title>Mochi — the append, animated</title>

<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: plated blob at rest on the meadow, three credited beads and one empty
                        slot at the right end. Everything here is opaque at t=0 (poster rule).
  10-25%  trigger:      a fourth bead descends into the empty slot                data-story="beat-2"
  25-55%  mechanism:    A stranger's move lands: the blob swells one notch and its last untended bead turns credited.
                                                                                  data-story="beat-3"
  55-80%  resolution:   the swollen height and the filled bead persist; the credited ring
                        seals shut and stays sealed                               data-story="beat-4"
  80-100% breathe + seam fade (the swell settles back only in the last 6%, so the
          residue covers 25-92% of the loop — the 3-second-window rule)
-->

  <defs>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF4E6"/>
      <stop offset="100%" stop-color="#FFF1E0"/>
    </linearGradient>
    <linearGradient id="a-meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C9F0DC"/>
      <stop offset="100%" stop-color="#A8E6CF"/>
    </linearGradient>
    <linearGradient id="a-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD9E8"/>
      <stop offset="100%" stop-color="#FFC2DC"/>
    </linearGradient>
    <clipPath id="a-clip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <filter id="a-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <style>
    /* The glow breath is the only CSS layer and it never drops below 0.12,
       so frame 0 is never a naked mark. */
    @keyframes breathe {
      0%   { opacity: 0.14; }
      30%  { opacity: 0.18; }
      48%  { opacity: 0.46; }
      78%  { opacity: 0.30; }
      100% { opacity: 0.14; }
    }
    .breath { animation: breathe 6s ease-in-out infinite; opacity: 0.14; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- plate -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#a-sky)"/>

  <g clip-path="url(#a-clip)">
    <!-- meadow -->
    <rect x="0" y="330" width="512" height="182" fill="url(#a-meadow)"/>
    <path d="M0 330 Q 128 312 256 330 T 512 330 L512 340 L0 340 Z" fill="#C9F0DC"/>

    <!-- glow breath behind the body -->
    <ellipse class="breath" cx="256" cy="232" rx="150" ry="130" fill="#FF8FB1" filter="url(#a-glow)"/>

    <!-- ground contact shadow -->
    <ellipse cx="256" cy="350" rx="120" ry="16" fill="#7A5165" opacity="0.12"/>

    <!-- the blob: a sphere under tween squash-stretch. No rig, no sculpt. -->
    <ellipse cx="256" cy="228" rx="139" ry="121" fill="url(#a-body)" stroke="#7A5165" stroke-width="15">
      <animate attributeName="ry" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.10;0.18;0.30;0.42;0.92;0.98;1"
               values="121;121;112;138;131;131;121;121"/>
      <animate attributeName="rx" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.10;0.18;0.30;0.42;0.92;0.98;1"
               values="139;139;148;132;142;142;139;139"/>
      <animate attributeName="cy" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.10;0.18;0.30;0.42;0.92;0.98;1"
               values="228;228;237;211;218;218;228;228"/>
    </ellipse>

    <!-- plane eyes: two quads. They ride the body and blink once per loop. -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
                        keyTimes="0;0.10;0.18;0.30;0.42;0.92;0.98;1"
                        values="0 0;0 0;0 9;0 -17;0 -10;0 -10;0 0;0 0"/>
      <rect x="189" y="200" width="26" height="46" rx="13" fill="#7A5165">
        <animate attributeName="height" dur="6s" repeatCount="indefinite"
                 keyTimes="0;0.58;0.61;0.64;1" values="46;46;6;46;46"/>
        <animate attributeName="y" dur="6s" repeatCount="indefinite"
                 keyTimes="0;0.58;0.61;0.64;1" values="200;200;220;200;200"/>
      </rect>
      <rect x="297" y="200" width="26" height="46" rx="13" fill="#7A5165">
        <animate attributeName="height" dur="6s" repeatCount="indefinite"
                 keyTimes="0;0.58;0.61;0.64;1" values="46;46;6;46;46"/>
        <animate attributeName="y" dur="6s" repeatCount="indefinite"
                 keyTimes="0;0.58;0.61;0.64;1" values="200;200;220;200;200"/>
      </rect>
    </g>

    <!-- the chain: an ordered row, left to right -->
    <line x1="70" y1="412" x2="440" y2="412" stroke="#7A5165" stroke-width="4" opacity="0.22"/>
    <g stroke-width="11">
      <circle cx="98"  cy="412" r="27" fill="#FFC2DC" stroke="#7A5165"/>
      <circle cx="202" cy="412" r="27" fill="#FFC2DC" stroke="#7A5165"/>
      <circle cx="306" cy="412" r="27" fill="#FFC2DC" stroke="#7A5165"/>
    </g>

    <!-- the empty slot at the end of the row — visible at t=0, vacated when the bead lands -->
    <circle cx="412" cy="412" r="27" fill="none" stroke="#7A5165" stroke-width="7"
            stroke-dasharray="10 12" opacity="0.55">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.18;0.26;0.96;1" values="0.55;0.55;0;0;0.55"/>
    </circle>

    <!-- the arriving move: descends, lands, and turns credited -->
    <circle data-story="beat-2" cx="412" cy="412" r="27" fill="#FF8FB1" stroke="#B2436A" stroke-width="11" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.10;0.22;0.92;0.96;1" values="0;0;1;1;1;0"/>
      <animate attributeName="cy" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.10;0.22;0.92;0.96;1" values="296;296;412;412;412;412"/>
      <animate attributeName="r" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.10;0.22;0.34;0.92;1" values="20;20;27;39;39;39"/>
    </circle>

    <!-- the credited ring seals shut around it and stays sealed -->
    <circle data-story="beat-3" cx="412" cy="412" r="55" fill="none" stroke="#B2436A" stroke-width="7"
            opacity="0.55" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.26;0.46;0.92;0.96;1" values="100;100;0;0;0;100"/>
    </circle>

    <!-- one ripple at the instant of the append -->
    <circle data-story="beat-4" cx="412" cy="412" r="39" fill="none" stroke="#FF8FB1" stroke-width="6" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.30;0.36;0.52;1" values="0;0;0.75;0;0"/>
      <animate attributeName="r" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.30;0.36;0.52;1" values="39;39;56;92;92"/>
    </circle>
  </g>

  <!-- plate edge: keeps the silhouette defined against a white page -->
  <rect x="3" y="3" width="506" height="506" rx="109" ry="109"
        fill="none" stroke="#7A5165" stroke-width="6" opacity="0.22"/>
</svg>

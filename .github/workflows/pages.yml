name: Pages

# Publishes the two web surfaces to https://mochi.edycu.dev
#
#   /        the landing page  — Next.js static export from landing/
#   /deck/   the pitch deck    — one self-contained HTML file from deck/
#
# Gated on the CI pipeline, for the same reason the release workflow is: what
# is on the domain should be a commit whose tests passed. A landing page that
# quotes "100% coverage" while the suite is red would be the exact kind of
# unverifiable claim the rest of this repo goes out of its way to avoid.
#
# Neither surface reaches the Decentraland World — .dclignore excludes landing/
# and deck/, so the scene payload is unchanged by anything here.
on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one supersede a queued older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: "Build both surfaces"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      # Both surfaces print the released version, and it must come from the
      # GitHub API rather than from package.json.
      #
      # The ordering makes package.json structurally wrong here: this workflow
      # runs off the CI pipeline completing, which happens on the FEATURE commit
      # — before semantic-release has bumped anything. So the file on disk at
      # this moment is always the previous release, and the site would sit a
      # version behind for ever. That is not hypothetical; the deck and the
      # landing page both served v1.13.0 while v1.14.0 was the latest release.
      #
      # Rebuilding on `release: published` looks like the obvious fix and is
      # not one: semantic-release authenticates with the default GITHUB_TOKEN,
      # and GitHub deliberately does not trigger workflow runs from events that
      # token creates. The trigger would never fire.
      #
      # Asking the API removes the ordering problem instead of racing it, and
      # it is the same source the README's shields.io badge reads — which is
      # why that badge was never wrong. Falls back to package.json if the
      # repository has no releases yet.
      - name: Resolve the released version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(gh api "repos/${{ github.repository }}/releases/latest" \
            --jq '.tag_name' 2>/dev/null | sed 's/^v//')"
          if [ -z "$version" ]; then
            version="$(node -p "require('./package.json').version")"
            echo "no release found — falling back to package.json ($version)"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "building both surfaces as v$version"

      - name: Install landing dependencies
        working-directory: landing
        run: npm ci

      # The landing page fetches the live creature state at build time so the
      # first paint carries real numbers and the page works with JavaScript
      # off. If the server is unreachable the page falls back to its offline
      # state rather than failing the build — a deploy should not depend on
      # Fly.io being up at that exact minute.
      - name: Build landing page
        working-directory: landing
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
        run: npm run build

      # The deck is a single self-contained file with no build step, so its
      # version chip is a literal in the source. Rewriting it here with the
      # version resolved above means the published deck always carries the
      # newest release tag without anyone having to remember. The landing page
      # gets the same number through NEXT_PUBLIC_APP_VERSION; both surfaces are
      # stamped from one resolution, so they cannot disagree with each other.
      - name: Add the pitch deck at /deck/, stamped with the release
        run: |
          mkdir -p landing/out/deck
          cp deck/index.html landing/out/deck/index.html
          node - "$APP_VERSION" <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const [version] = process.argv.slice(2)
          const path = 'landing/out/deck/index.html'
          const html = readFileSync(path, 'utf8')
          // Anchored on the id so it cannot match anything else in the file,
          // and idempotent: it replaces whatever version is there, including a
          // stale one, rather than assuming the source literal is current.
          const pattern = /(<a id="deck-version"[\s\S]*?>)[^<]*(<\/a>)/
          if (!pattern.test(html)) {
            throw new Error('deck version chip not found — did #deck-version move?')
          }
          writeFileSync(path, html.replace(pattern, `$1v${version}$2`))
          console.log(`deck stamped v${version}`)
          NODE

      # GitHub Pages serves _next/ fine, but Jekyll — which Pages runs by
      # default — ignores any directory beginning with an underscore. Without
      # this file every stylesheet and script 404s and the site renders naked.
      - name: Disable Jekyll
        run: touch landing/out/.nojekyll

      - name: Verify the artifact before publishing it
        run: |
          set -e
          test -f landing/out/index.html      || { echo "::error::no landing index.html"; exit 1; }
          test -f landing/out/deck/index.html || { echo "::error::no deck index.html"; exit 1; }
          test -f landing/out/CNAME           || { echo "::error::no CNAME — custom domain would reset"; exit 1; }
          test -f landing/out/.nojekyll       || { echo "::error::no .nojekyll"; exit 1; }
          # Both surfaces claim a version. A chip that silently renders empty,
          # or "dev", or last month's tag is worse than no chip at all, so the
          # deploy refuses rather than publishing a wrong number.
          grep -q "v${APP_VERSION}<" landing/out/deck/index.html \
            || { echo "::error::deck is not stamped v${APP_VERSION}"; exit 1; }
          grep -q "Release ${APP_VERSION}" landing/out/index.html \
            || { echo "::error::landing is not stamped ${APP_VERSION}"; exit 1; }
          echo "domain:  $(cat landing/out/CNAME)"
          echo "version: v${APP_VERSION} on both surfaces"
          echo "size:    $(du -sh landing/out | cut -f1)"
          echo "files:   $(find landing/out -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/out

  deploy:
    name: "Deploy to mochi.edycu.dev"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

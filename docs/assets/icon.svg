<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mochi — appends every stranger's move to one creature's body, credited by name">
  <title>Mochi</title>

  <!-- The mark is exactly what the scene renders: a sphere under squash, two plane
       eyes, and the append-only chain as an ordered row of beads. The rightmost
       bead is credited (accent); the ones before it are untended (primary).
       Self-plated so it holds on GitHub light AND dark without darkening the brand. -->

  <defs>
    <linearGradient id="m-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--sky-day, #FFF4E6)"/>
      <stop offset="100%" stop-color="var(--surface, #FFF1E0)"/>
    </linearGradient>

    <linearGradient id="m-meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--meadow-far, #C9F0DC)"/>
      <stop offset="100%" stop-color="var(--meadow-near, #A8E6CF)"/>
    </linearGradient>

    <linearGradient id="m-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--primary-soft, #FFD9E8)"/>
      <stop offset="100%" stop-color="var(--primary, #FFC2DC)"/>
    </linearGradient>

    <clipPath id="m-plate-clip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- plate -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#m-sky)"/>

  <g clip-path="url(#m-plate-clip)">
    <!-- meadow -->
    <rect x="0" y="330" width="512" height="182" fill="url(#m-meadow)"/>
    <path d="M0 330 Q 128 312 256 330 T 512 330 L512 340 L0 340 Z"
          fill="var(--meadow-far, #C9F0DC)"/>

    <!-- the blob: a sphere caught mid-squash. Nothing sculpted, nothing rigged. -->
    <ellipse cx="256" cy="228" rx="139" ry="121"
             fill="url(#m-body)"
             stroke="var(--untended-ink, #7A5165)" stroke-width="15"/>

    <!-- plane eyes -->
    <rect x="189" y="200" width="26" height="46" rx="13" fill="var(--untended-ink, #7A5165)"/>
    <rect x="297" y="200" width="26" height="46" rx="13" fill="var(--untended-ink, #7A5165)"/>

    <!-- the chain: an ordered row, left to right. Never an orbit — "last" is the point. -->
    <g stroke-width="11">
      <circle cx="98"  cy="412" r="27" fill="var(--primary, #FFC2DC)" stroke="var(--untended-ink, #7A5165)"/>
      <circle cx="202" cy="412" r="27" fill="var(--primary, #FFC2DC)" stroke="var(--untended-ink, #7A5165)"/>
      <circle cx="306" cy="412" r="27" fill="var(--primary, #FFC2DC)" stroke="var(--untended-ink, #7A5165)"/>
      <!-- the credited bead — the one that just took a stranger's name -->
      <circle cx="412" cy="412" r="39" fill="var(--credited, #FF8FB1)" stroke="var(--credited-ink, #B2436A)"/>
    </g>
    <circle cx="412" cy="412" r="55" fill="none"
            stroke="var(--credited-ink, #B2436A)" stroke-width="7" opacity="0.5"/>
  </g>

  <!-- plate edge: keeps the silhouette defined against a white page -->
  <rect x="3" y="3" width="506" height="506" rx="109" ry="109"
        fill="none" stroke="var(--untended-ink, #7A5165)" stroke-width="6" opacity="0.22"/>
</svg>

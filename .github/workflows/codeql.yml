# Static analysis of both TypeScript projects — the scene in src/ and the
# server in server/. CodeQL's autobuild is a no-op for an interpreted language
# stack, so nothing here needs the Decentraland toolchain.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query still finds an untouched repository.
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: initialize codeql
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - name: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

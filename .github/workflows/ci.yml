name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. A superseded push should stop burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1 · Quality ──────────────────────────────────────
  scene-quality:
    name: "Stage 1 · Scene build + typecheck"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Full matrix on main, single version on PRs.
        node-version: ${{ github.event_name == 'push' && fromJSON('[22, 24]') || fromJSON('[24]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # sdk-commands build bundles AND runs the type checker; a type error
      # fails this step.
      - name: Build scene
        run: npm run build

  server-quality:
    name: "Stage 1 · Server typecheck + tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        # node:sqlite ships with the runtime from 22.5; 22.4 would fail at import.
        node-version: ${{ github.event_name == 'push' && fromJSON('[22, 24]') || fromJSON('[24]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  # ── STAGE 2 · Security (parallel with Stage 1) ─────────────
  secret-scan:
    name: "Stage 2 · Secret scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the point is to scan history, not the tip
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-audit:
    name: "Stage 2 · Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit scene dependencies
        run: npm audit --audit-level=high
        continue-on-error: true # transitive SDK deps are not ours to patch
      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high
      - name: License compliance
        run: npx --yes license-checker --production --failOn "GPL-3.0;AGPL-3.0" --summary
        continue-on-error: true

  # ── STAGE 3 · Deployable payload ───────────────────────────
  payload:
    name: "Stage 3 · Deployable payload budget"
    needs: [scene-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure what actually deploys
        run: |
          # A World granted by an ENS domain caps the scene at 36 MB, and the
          # mobile client has no asset preloading — so first-load time is the
          # payload. .dclignore decides what ships; docs/, server/ and src/ do not.
          echo "📦 Deployable payload"
          echo "─────────────────────"
          TOTAL_KB=$(du -sk bin assets images main.crdt scene.json 2>/dev/null | awk '{s+=$1} END {print s}')
          echo "Total: ${TOTAL_KB} KB"
          if [ "$TOTAL_KB" -gt 25000 ]; then
            echo "::error::Payload ${TOTAL_KB}KB exceeds the 25 MB budget"
            exit 1
          elif [ "$TOTAL_KB" -gt 18000 ]; then
            echo "::warning::Payload ${TOTAL_KB}KB is approaching the 25 MB budget"
          else
            echo "✅ Within budget"
          fi

  # ── STAGE 4 · Protocol end-to-end ──────────────────────────
  protocol-e2e:
    name: "Stage 4 · Protocol end-to-end"
    needs: [server-quality]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Drives a real server over a real WebSocket — hello, feed, teach, the
      # away-line and guest rejection. There is no browser to drive: the client
      # is a Decentraland scene, which runs inside the Decentraland client and
      # cannot be exercised from CI. This is the honest edge of what CI can
      # reach; the rest is verified on a device.
      - name: Transport + room end-to-end
        run: npm run build && node --test "dist/test/transport.test.js"

  # ── STAGE 5 · Gate ─────────────────────────────────────────
  gate:
    name: "Stage 5 · All gates passed"
    needs: [scene-quality, server-quality, secret-scan, dependency-audit, payload, protocol-e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Summary
        run: |
          echo "🚀 All gates passed"
          echo "  ✅ Stage 1 — scene build + typecheck, server typecheck + 82 tests"
          echo "  ✅ Stage 2 — secret scan over full history, dependency audit, licenses"
          echo "  ✅ Stage 3 — deployable payload within budget"
          echo "  ✅ Stage 4 — protocol end-to-end over a real socket"
